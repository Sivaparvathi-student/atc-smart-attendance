<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — ATC Smart Attendance</title>
    <link rel="icon" type="image/png" href="/static/logos/atc-full.png" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #FFC107 0%, #FFD54F 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
        }
        .logo {
            text-align: center;
            margin-bottom: 25px;
        }
        .logo img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }
        h1 {
            text-align: center;
            font-size: 22px;
            color: #111;
            margin-bottom: 5px;
            font-weight: 800;
        }
        .subtitle {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #333;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 14px;
            transition: border 0.2s;
            background: #fafafa;
        }
        input:focus {
            outline: none;
            border-color: #FFC107;
            background: #fff;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #111;
            color: #FFC107;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
            margin-top: 10px;
        }
        button:hover {
            background: #FFC107;
            color: #111;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .message {
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }
        .message.error { background: #fee; color: #c00; display: block; }
        .message.success { background: #efe; color: #060; display: block; }
        .footer {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
            color: #666;
        }
        .footer a {
            color: #111;
            font-weight: 700;
            text-decoration: none;
            border-bottom: 2px solid #FFC107;
            padding-bottom: 2px;
        }
        .footer a:hover { color: #FFC107; }
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #FFC107;
            border-top-color: #111;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/static/logos/atc-full.png" alt="ATC Logo" />
        </div>
        <h1>ALIET Techpreneur Club</h1>
        <p class="subtitle">SMART ATTENDANCE SYSTEM</p>

        <div id="message" class="message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" required placeholder="you@aliet.ac.in" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter password" />
            </div>
            <button type="submit" id="loginBtn">SIGN IN</button>
        </form>

        <div class="footer">
            New volunteer? <a href="/register">Register here</a>
        </div>
    </div>

    <script>
        const API = window.location.origin;

        // If already logged in, redirect based on role
        const existingToken = localStorage.getItem("atc_token");
        const existingRole = localStorage.getItem("atc_role");
        if (existingToken && existingRole) {
            if (existingRole === "admin") window.location.href = "/admin-panel";
            else window.location.href = "/scanner";
        }

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("loginBtn");
            const msg = document.getElementById("message");
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>SIGNING IN...';
            msg.className = "message";

            try {
                const res = await fetch(`${API}/auth/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        email: document.getElementById("email").value.trim(),
                        password: document.getElementById("password").value
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    msg.className = "message error";
                    msg.textContent = data.detail || "Login failed";
                    btn.disabled = false;
                    btn.textContent = "SIGN IN";
                    return;
                }

                // Save token + role
                localStorage.setItem("atc_token", data.access_token);
                localStorage.setItem("atc_role", data.role);

                msg.className = "message success";
                msg.textContent = "Login successful! Redirecting...";

                setTimeout(() => {
                    if (data.role === "admin") window.location.href = "/admin-panel";
                    else window.location.href = "/scanner";
                }, 600);

            } catch (err) {
                msg.className = "message error";
                msg.textContent = "Network error. Is the server running?";
                btn.disabled = false;
                btn.textContent = "SIGN IN";
            }
        });
    </script>
</body>
</html>
